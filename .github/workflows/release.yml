name: Release

# Publishes to npm with trusted publishing (no NPM_TOKEN) when a GitHub release
# is published. The trusted publisher on npmjs.com names this file: release.yml.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    # Forks inherit this workflow; only the upstream repository publishes.
    if: github.repository == 'Continuous-Actions/go-tokenless'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable && yarn install --immutable
      - run: yarn check
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: npm publish --access public
