name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review and review_requested start the Claude review job.
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable && yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test
      - name: Dogfood (this repo's own release workflow must already be tokenless)
        run: node dist/cli.js --offline

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: medium
          online-audits: false

  # Claude review (shared reusable workflow). Runs only on pull requests from this
  # repository. The review action skips PRs that change this file, so those need a
  # human approval.
  claude-review:
    name: claude-review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'review_requested' ||
       github.event.requested_team.slug == 'claude-review')
    uses: continuous-actions/shared/.github/workflows/claude-review.yml@180631d76d2aab123900a17e27f2212331266137
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write

  # Dogfood the GitHub Action on this repository (expects: already tokenless).
  action:
    name: Action self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release PR pins a version that is published only after the tag; skip until then.
      - id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "go-tokenless@$version" version >/dev/null 2>&1; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::go-tokenless@$version is not on npm yet; skipping the self-check."; fi
      - uses: ./
        if: steps.published.outputs.yes == 'true'
        id: check
      - if: steps.published.outputs.yes == 'true'
        run: test "$STATUS" = already-tokenless
        env:
          STATUS: ${{ steps.check.outputs.status }}
