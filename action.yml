name: go-tokenless
description: Fail CI when npm publishing still relies on a stored NPM_TOKEN instead of trusted publishing (OIDC). Shows the exact fixes.
author: continuous-actions
branding:
  icon: shield
  color: blue

inputs:
  mode:
    description: "`check` fails the job when publishing still uses a token or needs a human decision; `report` only writes the summary and annotations."
    required: false
    default: check
  working-directory:
    description: Repository root to check (default the workspace).
    required: false
    default: .
  read-token:
    description: Name of the read-only token secret your install steps use for private packages (same as the CLI's --read-token), so it isn't reported.
    required: false
    default: ''

outputs:
  status:
    description: "already-tokenless, ready (token still used), blocked, or no-publish-workflow."
    value: ${{ steps.check.outputs.status }}

runs:
  using: composite
  steps:
    - name: Plan the trusted publishing migration (read-only)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPO: ${{ github.repository }}
        READ_TOKEN: ${{ inputs.read-token }}
      run: |
        args=(--json --repo "$REPO")
        if [ -n "$READ_TOKEN" ]; then args+=(--read-token "$READ_TOKEN"); fi
        npx --yes go-tokenless@1.0.0 "${args[@]}" > "$RUNNER_TEMP/go-tokenless-plan.json" || [ $? -eq 1 ]
    - name: Report
      id: check
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: node "$GITHUB_ACTION_PATH/action/check.mjs" "$RUNNER_TEMP/go-tokenless-plan.json" "$MODE"
